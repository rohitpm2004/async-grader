name: Backend Evaluation
on:
  repository_dispatch:
    types: [run-backend-evaluation]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone student repo
        run: |
          git clone --depth 1 "${{ github.event.client_payload.repoUrl }}" student-project
        continue-on-error: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd student-project
          npm install
          npm install --save-dev jest supertest axios 2>/dev/null || true
        continue-on-error: true

      - name: Write spec file
        run: |
          echo "${{ github.event.client_payload.specFile }}" | base64 -d > student-project/evaluator.test.js
        continue-on-error: false

      - name: Run Jest
        run: |
          cd student-project
          npx jest evaluator.test.js --config '{}' --json --outputFile=../jest-results.json --forceExit --testTimeout=15000 || true

      - name: Send results to webhook
        run: |
          RESULTS=$(cat jest-results.json 2>/dev/null || echo '{}')
          curl -X POST "${{ github.event.client_payload.webhookUrl }}" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${{ github.event.client_payload.webhookSecret }}" \
            -d "{\"jobId\": \"${{ github.event.client_payload.jobId }}\", \"status\": \"completed\", \"testResults\": $RESULTS}"
