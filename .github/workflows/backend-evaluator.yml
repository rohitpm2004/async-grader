name: Backend Evaluator

on:
  repository_dispatch:
    types: [run-backend-evaluation]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Student Repository
        run: |
          REPO_URL="${{ github.event.client_payload.repoUrl }}"
          # Fallback clone logic
          git clone "$REPO_URL" student-submission || echo "Failed to clone"

      - name: Extract Code Context
        id: extract
        run: |
          # Find all important backend JS files, excluding node_modules, build folders, or huge files.
          # We aggregate them into one text file to send back to the webhook.
          cd student-submission || exit 0
          
          CODE_OUTPUT=""
          
          # Find up to 15 relevant javascript/json files (models, controllers, routes, index, app, server, package.json)
          FILES=$(find . -type f \( -name "*.js" -o -name "package.json" \) -not -path "*/node_modules/*" -not -path "*/dist/*" -not -path "*/build/*" | head -n 15)
          
          for file in $FILES; do
            # Add file separator and truncate each file to 2500 characters to prevent massive payloads
            CODE_OUTPUT="$CODE_OUTPUT\n\n--- $file ---\n"
            FILE_CONTENT=$(head -c 2500 "$file")
            CODE_OUTPUT="$CODE_OUTPUT$FILE_CONTENT"
          done
          
          # Escape quotes and newlines for JSON payload
          ESCAPED_OUTPUT=$(echo "$CODE_OUTPUT" | jq -R -s '.')
          echo "CODE_CONTEXT=$ESCAPED_OUTPUT" >> $GITHUB_ENV

      - name: Send Webhook Callback
        if: always()
        run: |
          # Send the extracted code context back to the central-evaluators backendWorker
          PAYLOAD=$(jq -n \
            --arg jobId "${{ github.event.client_payload.jobId }}" \
            --arg status "completed" \
            --arg testOutput "${{ env.CODE_CONTEXT }}" \
            '{jobId: $jobId, status: $status, testOutput: ($testOutput | fromjson)}')
          
          curl -X POST "${{ github.event.client_payload.webhookUrl }}" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${{ github.event.client_payload.webhookSecret }}" \
            -d "$PAYLOAD"
