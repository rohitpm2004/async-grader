name: Backend Evaluator

on:
  repository_dispatch:
    types: [run-backend-evaluation]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Grader Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Clone Student Repository
        run: |
          REPO_URL="${{ github.event.client_payload.repoUrl }}"
          git clone "$REPO_URL" student-submission

      - name: Extract Code and Send Webhook
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          cat << 'EOF' > extract-and-send.js
          const fs = require('fs');
          const path = require('path');
          
          const payload = JSON.parse(process.env.PAYLOAD);
          const dir = path.join(process.cwd(), 'student-submission');
          
          let codeContext = '';
          let count = 0;
          
          function walkSync(currentDirPath) {
            if (count > 20) return;
            const files = fs.readdirSync(currentDirPath);
            for (const name of files) {
              if (name === 'node_modules' || name === '.git' || name === 'dist' || name === 'build' || name === 'package-lock.json') continue;
              const filePath = path.join(currentDirPath, name);
              const stat = fs.statSync(filePath);
              if (stat.isFile()) {
                if (name.endsWith('.js') || name === 'package.json') {
                  const content = fs.readFileSync(filePath, 'utf8').slice(0, 3000);
                  const relPath = path.relative(dir, filePath);
                  codeContext += `\n--- ${relPath} ---\n${content}\n`;
                  count++;
                }
              } else if (stat.isDirectory()) {
                walkSync(filePath);
              }
            }
          }
          
          try {
            walkSync(dir);
          } catch(e) {
            console.error("Error reading files:", e);
          }
          
          const webhookPayload = {
            jobId: payload.jobId,
            status: "completed",
            testOutput: codeContext
          };

          fetch(payload.webhookUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-webhook-secret': payload.webhookSecret
            },
            body: JSON.stringify(webhookPayload)
          }).then(async res => {
            console.log('Webhook status:', res.status);
            const text = await res.text();
            console.log('Webhook response:', text);
            process.exit(0);
          }).catch(err => {
            console.error('Webhook failed:', err);
            process.exit(1);
          });
          EOF
          
          node extract-and-send.js
