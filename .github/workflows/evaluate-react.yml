name: Evaluate React Assignment

on:
  repository_dispatch:
    types: [run-react-evaluation]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Grader Repository
        uses: actions/checkout@v4

      - name: Clone Student Repository
        run: |
          git clone "${{ github.event.client_payload.repoUrl }}" student-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./student-repo
        run: npm install --legacy-peer-deps

      - name: Smart Build (Fallback Logic)
        id: build
        working-directory: ./student-repo
        continue-on-error: true
        run: |
          if jq -e '.scripts.build' package.json > /dev/null; then
            echo "Build script found. Running npm run build..."
            npm run build
          elif grep -q '"vite"' package.json; then
            echo "Vite detected but no build script. Running npx vite build..."
            npx vite build
          elif grep -q '"react-scripts"' package.json; then
            echo "CRA detected but no build script. Running npx react-scripts build..."
            npx react-scripts build
          else
            echo "No build framework detected. Skipping build."
          fi

      - name: Run Linter (Syntax Check)
        id: lint
        working-directory: ./student-repo
        continue-on-error: true
        run: |
          echo "Running ESLint..."
          npx eslint . --ext .js,.jsx,.ts,.tsx > linter-report.txt || true
          cat linter-report.txt

      - name: Inject and Run React Rubric Tests
        id: tests
        working-directory: ./student-repo
        continue-on-error: true
        run: |
          echo "Injecting todo.spec.jsx into student-repo/src..."
          cp ../todo.spec.jsx ./src/todo.spec.jsx || cp ../todo.spec.jsx ./todo.spec.jsx || true
          echo "Installing Vitest and testing library dependencies..."
          npm install vitest @testing-library/react @testing-library/dom @testing-library/jest-dom jsdom --no-save --legacy-peer-deps || true
          echo "Running Vitest..."
          npx vitest run src/todo.spec.jsx --reporter=json --outputFile=../test-results.json || npx vitest run todo.spec.jsx --reporter=json --outputFile=../test-results.json || true
          cat ../test-results.json || echo "No test results file."

      - name: Send Webhook Result
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" == "failure" ]; then
            STATUS="failed"
            OUTPUT="Build: Failed. The application could not be compiled. Check for syntax errors."
          else
            STATUS="completed"
            LINT_OUTPUT=$(cat ./student-repo/linter-report.txt 2>/dev/null || echo "No lint errors.")
            OUTPUT="Build: Success.\nLinter Report:\n$LINT_OUTPUT"
          fi
          
          # Read test results
          TEST_JSON=$(cat test-results.json 2>/dev/null || echo '{"error": "No test results file generated due to build/execution error."}')
          
          # Send back to Node server
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${{ github.event.client_payload.webhookSecret }}" \
            -d "$(jq -n \
              --arg status "$STATUS" \
              --arg output "$OUTPUT" \
              --arg jobId "${{ github.event.client_payload.jobId }}" \
              --argjson testResults "$TEST_JSON" \
              '{jobId: $jobId, status: $status, testOutput: $output, testResults: $testResults}')" \
            "${{ github.event.client_payload.webhookUrl }}"
