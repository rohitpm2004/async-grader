name: Full Stack Evaluation

on:
  repository_dispatch:
    types: [run-fullstack-evaluation]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Clone student repo
        run: |
          git clone --depth 1 "${{ github.event.client_payload.repoUrl }}" student-project
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Runner Node Environment (outside student project)
        run: |
          npm init -y
          npm install @playwright/test axios
          npx playwright install --with-deps chromium

      - name: Auto-Create Missing Frontend Entry Files
        run: |
          # Detect frontend directory
          F_DIR=""
          for dir in student-project/frontend student-project/client student-project/app student-project; do
            if [ -f "$dir/package.json" ] && [ -d "$dir/src" ] && [ "$dir" != "student-project/backend" ] && [ "$dir" != "student-project/server" ]; then
              F_DIR="$dir"
              break
            fi
          done
          
          if [ -n "$F_DIR" ]; then
            echo "Detected frontend folder: $F_DIR"
            
            # Create default index.html if missing
            if [ ! -f "$F_DIR/index.html" ]; then
              echo "index.html is missing. Generating default index.html..."
              cat << 'EOF' > "$F_DIR/index.html"
              <!DOCTYPE html>
              <html lang="en">
                <head>
                  <meta charset="UTF-8" />
                  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                  <title>E-Commerce Store</title>
                </head>
                <body>
                  <div id="root"></div>
                  <script type="module" src="/src/main.jsx"></script>
                </body>
              </html>
EOF
            fi

            # Create default src/main.jsx entry if missing
            if [ ! -f "$F_DIR/src/main.jsx" ] && [ ! -f "$F_DIR/src/index.jsx" ] && [ ! -f "$F_DIR/src/main.js" ] && [ ! -f "$F_DIR/src/index.js" ]; then
              echo "React entry main.jsx is missing. Generating default src/main.jsx..."
              mkdir -p "$F_DIR/src"
              cat << 'EOF' > "$F_DIR/src/main.jsx"
              import React from 'react'
              import ReactDOM from 'react-dom/client'
              import App from './App.jsx'

              ReactDOM.createRoot(document.getElementById('root')).render(
                <React.StrictMode>
                  <App />
                </React.StrictMode>
              )
EOF
            fi
          else
            echo "No dedicated frontend src directory found."
          fi

      - name: Install Student Backend & Frontend Dependencies
        run: |
          ROOT_DIR=$(pwd)
          # Install root if package.json exists
          if [ -f "$ROOT_DIR/student-project/package.json" ]; then
            cd "$ROOT_DIR/student-project" && npm install --legacy-peer-deps || true
          fi
          
          # Install subdirectories if present
          for dir in backend frontend server client api app; do
            if [ -d "$ROOT_DIR/student-project/$dir" ] && [ -f "$ROOT_DIR/student-project/$dir/package.json" ]; then
              echo "Installing dependencies inside student-project/$dir..."
              cd "$ROOT_DIR/student-project/$dir"
              
              # Force install vite devDependency if it's a frontend folder to ensure command exists
              if [ "$dir" = "frontend" ] || [ "$dir" = "client" ]; then
                npm install --save-dev vite --legacy-peer-deps || true
              fi
              
              npm install --legacy-peer-deps || true
            fi
          done
          cd "$ROOT_DIR"

      - name: Write spec file
        run: |
          echo "${{ github.event.client_payload.specFile }}" | base64 -d > fullstack.spec.js

      - name: Start Backend Server
        run: |
          # Kill any existing process using port 5000 or 5001 to prevent EADDRINUSE conflicts
          sudo fuser -k 5000/tcp || true
          sudo fuser -k 5001/tcp || true
          
          ROOT_DIR=$(pwd)
          # Detect backend directory
          B_DIR="$ROOT_DIR/student-project"
          for dir in student-project/backend student-project/server student-project/api; do
            if [ -f "$ROOT_DIR/$dir/package.json" ]; then
              B_DIR="$ROOT_DIR/$dir"
              break
            fi
          done
          echo "Starting backend from: $B_DIR"
          cd "$B_DIR"
          export PORT=5000
          export MONGODB_URI="mongodb://localhost:27017/fullstack-test"
          
          # Check if there is a start script. If yes, run npm start. Otherwise, fall back to direct launch.
          has_start=$(node -e "try { console.log(!!require('./package.json').scripts?.start) } catch { console.log(false) }")
          if [ "$has_start" = "true" ]; then
            npm run start &
          else
            if [ -f "server.js" ]; then
              node server.js &
            elif [ -f "index.js" ]; then
              node index.js &
            elif [ -f "src/server.js" ]; then
              node src/server.js &
            fi
          fi
          
          sleep 5
          cd "$ROOT_DIR"
        continue-on-error: true

      - name: Start Frontend Server
        run: |
          ROOT_DIR=$(pwd)
          # Detect frontend directory
          F_DIR="$ROOT_DIR/student-project"
          for dir in student-project/frontend student-project/client student-project/app; do
            if [ -f "$ROOT_DIR/$dir/package.json" ]; then
              F_DIR="$ROOT_DIR/$dir"
              break
            fi
          done
          echo "Starting frontend from: $F_DIR"
          cd "$F_DIR"
          export PORT=5173
          
          # Try run dev or start
          npm run dev &
          npm run start &
          
          sleep 6
          cd "$ROOT_DIR"
        continue-on-error: true

      - name: Run Playwright Tests
        run: |
          # Run playwright from the runner's root directory pointing to fullstack.spec.js
          npx playwright test fullstack.spec.js --reporter=json > playwright-results.json || true

      - name: Send results to webhook
        run: |
          RESULTS=$(cat playwright-results.json 2>/dev/null || echo '{}')
          curl -X POST "${{ github.event.client_payload.webhookUrl }}" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${{ github.event.client_payload.webhookSecret }}" \
            -d "{\"jobId\": \"${{ github.event.client_payload.jobId }}\", \"status\": \"completed\", \"testResults\": $RESULTS}"
