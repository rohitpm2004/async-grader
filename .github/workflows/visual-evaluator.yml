name: Visual Evaluator

on:
  repository_dispatch:
    types: [run-visual-evaluation]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Grader Repository
        uses: actions/checkout@v3

      - name: Setup Node.js & Playwright
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Dependencies
        run: |
          npm init -y
          npm install playwright openai
          npx playwright install --with-deps chromium

      - name: Clone Student Repository
        run: |
          REPO_URL="${{ github.event.client_payload.repoUrl }}"
          if [[ "$REPO_URL" == *"/blob/"* || "$REPO_URL" == *".html" ]]; then
            mkdir -p student-submission
            RAW_URL=$(echo "$REPO_URL" | sed 's|/blob/|/raw/|')
            curl -sL "$RAW_URL" -o student-submission/index.html
          else
            git clone "$REPO_URL" student-submission || {
              echo "Git clone failed. Creating fallback empty submission."
              mkdir -p student-submission
            }
          fi

      - name: Run Visual Evaluation
        id: run-eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: "https://api.deepseek.com"
          OPENAI_MODEL: "deepseek-v4-flash"
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          cat << 'EOF' > run-eval.js
          const { chromium } = require('playwright');
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const { OpenAI } = require('openai');

          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const DIR = path.join(process.cwd(), 'student-submission');

          // Initialize OpenAI client pointing to DeepSeek
          const openai = new OpenAI({
            apiKey: process.env.OPENAI_API_KEY,
            baseURL: process.env.OPENAI_BASE_URL || 'https://api.deepseek.com'
          });

          // 1. Simple Static Server for Student's Webpage
          const server = http.createServer((req, res) => {
            let filePath = path.join(DIR, req.url === '/' ? 'index.html' : req.url);
            if (!fs.existsSync(filePath)) {
              res.writeHead(404);
              res.end();
              return;
            }
            const ext = path.extname(filePath);
            const mime = ext === '.html' ? 'text/html' :
                         ext === '.css' ? 'text/css' :
                         ext === '.js' ? 'application/javascript' : 'text/plain';
            res.writeHead(200, { 'Content-Type': mime });
            res.end(fs.readFileSync(filePath));
          });

          async function evaluate() {
            server.listen(3000);
            
            let screenshotBase64 = '';
            let codeContext = '';
            
            try {
              // Extract Student Source Code
              const files = ['index.html', 'style.css', 'script.js', 'app.js', 'styles.css', 'main.js'];
              for (const file of files) {
                const fp = path.join(DIR, file);
                if (fs.existsSync(fp)) {
                  codeContext += `\n--- ${file} ---\n${fs.readFileSync(fp, 'utf8').slice(0, 3000)}\n`;
                }
              }

              // Render in Playwright & Capture Screenshot
              try {
                const browser = await chromium.launch();
                const context = await browser.newContext({ viewport: { width: 1280, height: 720 } });
                const page = await context.newPage();
                await page.goto('http://localhost:3000', { waitUntil: 'networkidle', timeout: 15000 }).catch(() => {});
                
                const buffer = await page.screenshot({ fullPage: true }).catch(() => null);
                if (buffer) {
                  screenshotBase64 = buffer.toString('base64');
                }
                await browser.close().catch(() => {});
              } catch (browserErr) {
                console.warn("Browser capture warning:", browserErr.message);
              }

              // Build Prompt
              const prompt = `
          You are an expert web development instructor grading a student's HTML/CSS/JS assignment.

          ## Rubric / Requirements:
          ${payload.rubricText || 'Grade the design, HTML structure, CSS styling, and JavaScript functionality.'}

          ## Student's Code:
          ${codeContext || 'No source files detected in repository.'}

          **IMPORTANT GRADING INSTRUCTIONS:**
          1. **Functionality & Logic First:** Check the JavaScript logic, event listeners, DOM updates, and HTML structure.
          2. **Strict But Fair Scoring:** Award marks based on how many rubric requirements are actually implemented in code.
          3. **Never fail on styling quirks:** If the JavaScript works, award full credit for the functional requirements.

          Output STRICTLY a JSON object with this exact format (no markdown, no extra text):
          {
            "score": <integer 0-100>,
            "summary": "1-2 sentences summarizing their attempt and implementation.",
            "strengths": ["1-2 things they implemented correctly in HTML/CSS/JS"],
            "issues": ["1-2 specific missing features or bugs based on rubric"]
          }
              `.trim();

              const model = process.env.OPENAI_MODEL || 'deepseek-v4-flash';
              
              // Call DeepSeek API
              const response = await openai.chat.completions.create({
                model: model,
                messages: [
                  {
                    role: "user",
                    content: prompt
                  }
                ],
                max_tokens: 500,
                temperature: 0.2,
                response_format: { type: "json_object" }
              });

              const resultStr = response.choices[0]?.message?.content?.trim() || "{}";
              const resultObj = JSON.parse(resultStr);
              
              const finalScore = typeof resultObj.score === 'number' ? Math.max(0, Math.min(100, Math.round(resultObj.score))) : 0;

              fs.writeFileSync('result.json', JSON.stringify({
                score: finalScore,
                feedback: JSON.stringify({
                  summary: resultObj.summary || "Evaluation completed.",
                  strengths: resultObj.strengths || (finalScore === 100 ? ["Passed all requirements."] : []),
                  issues: resultObj.issues || []
                })
              }));

            } catch (err) {
              console.error("Evaluation script error:", err);
              fs.writeFileSync('result.json', JSON.stringify({
                score: 0,
                feedback: JSON.stringify({
                  summary: "Evaluation script encountered an error.",
                  strengths: [],
                  issues: [err.message]
                })
              }));
            } finally {
              server.close();
              process.exit(0);
            }
          }

          evaluate();
          EOF
          
          node run-eval.js

      - name: Send Webhook Callback
        if: always()
        run: |
          SCORE=$(jq -r '.score' result.json || echo 0)
          FEEDBACK=$(jq -r '.feedback' result.json || echo "Unknown error")
          
          PAYLOAD=$(jq -n \
            --arg jobId "${{ github.event.client_payload.jobId }}" \
            --arg status "completed" \
            --argjson score "$SCORE" \
            --arg feedback "$FEEDBACK" \
            '{jobId: $jobId, status: $status, result: {score: $score, feedback: $feedback}}')
          
          curl -X POST "${{ github.event.client_payload.webhookUrl }}" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${{ github.event.client_payload.webhookSecret }}" \
            -d "$PAYLOAD"
