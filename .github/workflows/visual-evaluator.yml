name: Visual Evaluator

on:
  repository_dispatch:
    types: [run-visual-evaluation]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: |
          npm init -y
          npm install cheerio

      - name: Clone Student Repository
        run: |
          REPO_URL="${{ github.event.client_payload.repoUrl }}"
          if [[ "$REPO_URL" == *"/blob/"* || "$REPO_URL" == *".html" ]]; then
            mkdir -p student-submission
            RAW_URL=$(echo "$REPO_URL" | sed 's|/blob/|/raw/|')
            curl -sL "$RAW_URL" -o student-submission/index.html
          else
            git clone "$REPO_URL" student-submission || {
              echo "Git clone failed"
              mkdir -p student-submission
            }
          fi

      - name: Run Deterministic Rubric Code Evaluation
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const cheerio = require('cheerio');
          const vm = require('vm');

          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const DIR = path.join(process.cwd(), 'student-submission');

          function findFiles(dir, ext) {
            let results = [];
            if (!fs.existsSync(dir)) return results;
            try {
              const list = fs.readdirSync(dir, { withFileTypes: true });
              for (const item of list) {
                const fullPath = path.join(dir, item.name);
                if (item.isDirectory() && item.name !== 'node_modules' && item.name !== '.git') {
                  results = results.concat(findFiles(fullPath, ext));
                } else if (item.isFile() && item.name.toLowerCase().endsWith(ext)) {
                  results.push(fullPath);
                }
              }
            } catch (e) {}
            return results;
          }

          function stripComments(code) {
            if (!code) return '';
            return code.replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*$/gm, '$1').trim();
          }

          function parseRubricCriteria(rawRubric) {
            if (!rawRubric) {
              return [
                { name: 'HTML Structure & Markup', weight: 25, desc: 'HTML page layout, semantic tags, and valid structure' },
                { name: 'File Linking & Connections', weight: 15, desc: 'Proper linking of stylesheet and javascript files in HTML' },
                { name: 'CSS Styling & Design', weight: 25, desc: 'CSS stylesheet styling and layout properties' },
                { name: 'JavaScript DOM & Interactivity', weight: 35, desc: 'Active JavaScript logic, event listeners, and DOM mutations' }
              ];
            }

            try {
              let parsed = typeof rawRubric === 'string' ? JSON.parse(rawRubric) : rawRubric;
              while (typeof parsed === 'string') parsed = JSON.parse(parsed);

              let list = Array.isArray(parsed) ? parsed : (parsed.criteria || parsed.items || []);
              if (Array.isArray(list) && list.length > 0) {
                return list.map((c, i) => ({
                  name: c.name || c.description || ('Criterion ' + (i + 1)),
                  weight: Number(c.weight ?? c.score ?? c.max ?? 20) || 20,
                  desc: (c.description || c.name || '').toLowerCase()
                }));
              }
            } catch (e) {}

            const lines = String(rawRubric).split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 3);
            const items = [];
            for (const line of lines) {
              const weightMatch = line.match(/\((\d+)\s*(?:pts?|points?|marks?|%)\)/i) ||
                                  line.match(/\[(\d+)\s*(?:pts?|points?|marks?|%)\]/i) ||
                                  line.match(/(\d+)\s*(?:pts?|points?|marks?)\s*[-:]/i);
              const weight = weightMatch ? parseInt(weightMatch[1], 10) : 20;
              const name = line.replace(/^\d+[\.\)]\s*/, '').replace(/^[-*•]\s*/, '').replace(/\(.*\)/, '').trim();
              if (name) items.push({ name: name, weight: weight, desc: name.toLowerCase() });
            }

            return items.length > 0 ? items : [
              { name: 'HTML Structure & Markup', weight: 25, desc: 'HTML page layout, semantic tags, and valid structure' },
              { name: 'File Linking & Connections', weight: 15, desc: 'Proper linking of stylesheet and javascript files in HTML' },
              { name: 'CSS Styling & Design', weight: 25, desc: 'CSS stylesheet styling and layout properties' },
              { name: 'JavaScript DOM & Interactivity', weight: 35, desc: 'Active JavaScript logic, event listeners, and DOM mutations' }
            ];
          }

          async function evaluate() {
            const htmlFiles = findFiles(DIR, '.html');
            const cssFiles = findFiles(DIR, '.css');
            const jsFiles = findFiles(DIR, '.js');

            if (htmlFiles.length === 0 && cssFiles.length === 0 && jsFiles.length === 0) {
              const defaultCriteria = parseRubricCriteria(payload.rubricText);
              fs.writeFileSync('result.json', JSON.stringify({
                score: 0,
                feedback: {
                  summary: 'Evaluation completed: Repository contains no HTML, CSS, or JavaScript files.',
                  strengths: [],
                  issues: ['No source code files found in repository.'],
                  breakdown: defaultCriteria.map(c => ({ item: c.name, awarded: 0, max: c.weight, reason: 'No files submitted.' }))
                }
              }));
              return;
            }

            // 1. Read & Parse HTML
            let mainHtmlContent = '';
            let isHtmlClosed = false;
            let $ = null;
            if (htmlFiles.length > 0) {
              mainHtmlContent = fs.readFileSync(htmlFiles[0], 'utf8');
              isHtmlClosed = mainHtmlContent.includes('</html>') || mainHtmlContent.includes('</body>');
              try {
                $ = cheerio.load(mainHtmlContent);
              } catch (e) {}
            }

            // 2. Check File Connections (link & script tags)
            let cssLinked = false;
            let jsLinked = false;
            if ($) {
              $('link[rel=\"stylesheet\"]').each((i, el) => {
                const href = $(el).attr('href');
                if (href) {
                  const resolved = path.join(path.dirname(htmlFiles[0]), href);
                  if (fs.existsSync(resolved) || cssFiles.some(f => f.endsWith(path.basename(href)))) {
                    cssLinked = true;
                  }
                }
              });
              $('script[src]').each((i, el) => {
                const src = $(el).attr('src');
                if (src) {
                  const resolved = path.join(path.dirname(htmlFiles[0]), src);
                  if (fs.existsSync(resolved) || jsFiles.some(f => f.endsWith(path.basename(src)))) {
                    jsLinked = true;
                  }
                }
              });
            }

            // 3. Read & Validate CSS
            let allActiveCss = '';
            for (const f of cssFiles) {
              const raw = fs.readFileSync(f, 'utf8');
              allActiveCss += '\n' + stripComments(raw);
            }

            // 4. Read & Validate JavaScript across all JS files
            let allActiveJs = '';
            let jsSyntaxErrors = [];
            let hasRawJsCode = false;

            for (const f of jsFiles) {
              const raw = fs.readFileSync(f, 'utf8');
              if (raw.trim().length > 0) hasRawJsCode = true;
              const active = stripComments(raw);
              if (active.length > 0) {
                allActiveJs += '\n' + active;
                try {
                  new vm.Script(active);
                } catch (err) {
                  jsSyntaxErrors.push(path.basename(f) + ': ' + err.message);
                }
              }
            }

            const isJsValid = jsSyntaxErrors.length === 0 && allActiveJs.length > 0;
            const hasEventHandling = allActiveJs.includes('addEventListener') || allActiveJs.includes('onclick') || allActiveJs.includes('.on');
            const hasDomMutation = allActiveJs.includes('innerText') || allActiveJs.includes('innerHTML') || allActiveJs.includes('textContent') || allActiveJs.includes('value') || allActiveJs.includes('classList');

            // 5. Evaluate Rubric Criteria Deterministically
            const criteria = parseRubricCriteria(payload.rubricText);
            const totalMax = criteria.reduce((sum, c) => sum + c.weight, 0) || 100;
            let earnedScore = 0;
            const breakdown = [];
            const strengths = [];
            const issues = [];

            for (const c of criteria) {
              const d = c.desc;
              let awarded = 0;
              let reason = '';

              // A. Linking / File Connection Criterion
              if (d.includes('link') || d.includes('connect') || d.includes('structure') && d.includes('project')) {
                if (cssLinked && (jsLinked || jsFiles.length === 0)) {
                  awarded = c.weight;
                  reason = 'Stylesheet and script files are properly linked in HTML and exist in the repository.';
                } else if (cssLinked || jsLinked) {
                  awarded = Math.round(c.weight * 0.5);
                  reason = 'Partial file connection: either CSS or JS link is missing or pointing to a non-existent file.';
                } else {
                  awarded = 0;
                  reason = 'Stylesheet (<link>) and Script (<script>) are not linked or point to missing files.';
                }
              }
              // B. HTML Structure & Markup Criterion
              else if (d.includes('html') || d.includes('structure') || d.includes('layout') && !d.includes('css')) {
                if ($ && isHtmlClosed && mainHtmlContent.length > 80 && ($('body').children().length > 0)) {
                  awarded = c.weight;
                  reason = 'Well-structured HTML with properly closed semantic tags and containers.';
                } else if ($ && mainHtmlContent.length > 40) {
                  awarded = Math.round(c.weight * 0.3);
                  reason = 'Incomplete HTML structure (tags unclosed or missing elements).';
                } else {
                  awarded = 0;
                  reason = 'HTML file is missing, empty, or unparseable.';
                }
              }
              // C. CSS Styling & Design Criterion
              else if (d.includes('css') || d.includes('style') || d.includes('design') || d.includes('responsive')) {
                if (allActiveCss.length > 60 && (allActiveCss.includes('{') && allActiveCss.includes('}'))) {
                  awarded = c.weight;
                  reason = 'Active CSS rules, styling properties, and visual layout implemented.';
                } else if (allActiveCss.length > 20) {
                  awarded = Math.round(c.weight * 0.4);
                  reason = 'Minimal CSS styling provided.';
                } else {
                  awarded = 0;
                  reason = 'CSS stylesheet is empty or missing active styles.';
                }
              }
              // D. General JS / DOM Functionality Criterion
              else if (d.includes('js') || d.includes('javascript') || d.includes('function') || d.includes('logic') || d.includes('dom')) {
                if (jsSyntaxErrors.length > 0) {
                  awarded = 0;
                  reason = 'JavaScript syntax error prevented execution: ' + jsSyntaxErrors.join(', ');
                } else if (!hasRawJsCode || (hasRawJsCode && allActiveJs.length === 0)) {
                  awarded = 0;
                  reason = 'JavaScript code is completely commented out or empty.';
                } else if (isJsValid && hasDomMutation) {
                  awarded = c.weight;
                  reason = 'Active JavaScript logic, event handling, and DOM manipulation verified without errors.';
                } else if (isJsValid) {
                  awarded = Math.round(c.weight * 0.6);
                  reason = 'JavaScript syntax is valid but lacks active DOM updates.';
                } else {
                  awarded = 0;
                  reason = 'JavaScript logic is incomplete or missing.';
                }
              }
              // E. Specific Feature / Interactivity Criterion (e.g. clock, toggle, counter, lock, input, etc.)
              else {
                if (jsSyntaxErrors.length > 0) {
                  awarded = 0;
                  reason = 'JavaScript syntax error in script: ' + jsSyntaxErrors.join(', ');
                } else if (allActiveJs.length === 0) {
                  awarded = 0;
                  reason = 'Required functional logic is missing or commented out in JavaScript.';
                } else {
                  const keywords = d.split(/\\s+/).filter(w => w.length > 3 && !['with', 'from', 'that', 'this', 'have', 'been'].includes(w));
                  const foundInDom = $ && keywords.some(k => mainHtmlContent.toLowerCase().includes(k));
                  const foundInJs = keywords.some(k => allActiveJs.toLowerCase().includes(k));

                  if (foundInDom && foundInJs && hasDomMutation) {
                    awarded = c.weight;
                    reason = 'Feature elements found in HTML and functional logic implemented in JavaScript.';
                  } else if (foundInJs) {
                    awarded = Math.round(c.weight * 0.7);
                    reason = 'Feature logic found in JavaScript code.';
                  } else if (foundInDom) {
                    awarded = Math.round(c.weight * 0.4);
                    reason = 'UI elements present in HTML, but active JavaScript logic is missing.';
                  } else {
                    awarded = 0;
                    reason = 'Requirement not found in active HTML or JavaScript code.';
                  }
                }
              }

              earnedScore += awarded;
              breakdown.push({ item: c.name, awarded: awarded, max: c.weight, reason: reason });
              if (awarded === c.weight) {
                strengths.push('[' + c.name + '] ' + reason + ' (earned ' + awarded + '/' + c.weight + ' marks)');
              } else {
                issues.push('[' + c.name + '] ' + reason + ' (earned ' + awarded + '/' + c.weight + ' marks)');
              }
            }

            const finalScore = Math.round((earnedScore / totalMax) * 100);
            let summary = '';
            if (finalScore === 100) {
              summary = 'Outstanding! All HTML structure, CSS styling, file links, and JavaScript DOM requirements are fully satisfied.';
            } else if (finalScore >= 60) {
              summary = 'Good effort. Your project meets core requirements with a score of ' + finalScore + '/100, but has minor missing elements or broken links.';
            } else if (finalScore > 0) {
              summary = 'Evaluation score: ' + finalScore + '/100. Several required features, active JavaScript functions, or HTML elements are missing.';
            } else {
              summary = 'Evaluation score: 0/100. Code is either completely commented out, has fatal syntax errors, or missing required files.';
            }

            fs.writeFileSync('result.json', JSON.stringify({
              score: finalScore,
              feedback: {
                summary: summary,
                strengths: strengths,
                issues: issues,
                breakdown: breakdown
              }
            }));
          }

          evaluate().catch(err => {
            console.error('Fatal evaluation runtime error:', err);
            fs.writeFileSync('result.json', JSON.stringify({
              score: 0,
              feedback: {
                summary: 'Evaluation encountered a fatal runtime error.',
                strengths: [],
                issues: [err.message],
                breakdown: []
              }
            }));
          });
          "

      - name: Send Webhook Callback
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const https = require('https');
            const http = require('http');

            let resultObj = { score: 0, feedback: { summary: 'Evaluation completed.', strengths: [], issues: [], breakdown: [] } };
            try {
              if (fs.existsSync('result.json')) {
                resultObj = JSON.parse(fs.readFileSync('result.json', 'utf8'));
              }
            } catch (e) {}

            const payloadData = {
              jobId: '${{ github.event.client_payload.jobId }}',
              status: 'completed',
              result: {
                score: typeof resultObj.score === 'number' ? resultObj.score : 0,
                feedback: resultObj.feedback
              }
            };

            const data = JSON.stringify(payloadData);
            const webhookUrl = '${{ github.event.client_payload.webhookUrl }}';
            const secret = '${{ github.event.client_payload.webhookSecret }}';

            const u = new URL(webhookUrl);
            const reqLib = u.protocol === 'https:' ? https : http;

            const req = reqLib.request(webhookUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-webhook-secret': secret,
                'Content-Length': Buffer.byteLength(data)
              }
            }, (res) => {
              console.log('Webhook responded with status:', res.statusCode);
            });

            req.on('error', (e) => {
              console.error('Webhook request error:', e);
            });

            req.write(data);
            req.end();
          "
