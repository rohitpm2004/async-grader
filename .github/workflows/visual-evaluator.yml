name: Visual Evaluator

on:
  repository_dispatch:
    types: [run-visual-evaluation]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: |
          npm init -y
          npm install cheerio openai

      - name: Clone Student Repository
        run: |
          REPO_URL="${{ github.event.client_payload.repoUrl }}"
          if [[ "$REPO_URL" == *"/blob/"* || "$REPO_URL" == *".html" ]]; then
            mkdir -p student-submission
            RAW_URL=$(echo "$REPO_URL" | sed 's|/blob/|/raw/|')
            curl -sL "$RAW_URL" -o student-submission/index.html
          else
            git clone "$REPO_URL" student-submission || {
              echo "Git clone failed"
              mkdir -p student-submission
            }
          fi

      - name: Run Dynamic Rubric Evaluation
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.deepseek.com' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'deepseek-v4-flash' }}
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const cheerio = require('cheerio');
          const vm = require('vm');
          const OpenAI = require('openai');

          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const DIR = path.join(process.cwd(), 'student-submission');

          function findFiles(dir, ext) {
            let results = [];
            if (!fs.existsSync(dir)) return results;
            try {
              const list = fs.readdirSync(dir, { withFileTypes: true });
              for (const item of list) {
                const fullPath = path.join(dir, item.name);
                if (item.isDirectory() && item.name !== 'node_modules' && item.name !== '.git') {
                  results = results.concat(findFiles(fullPath, ext));
                } else if (item.isFile() && item.name.toLowerCase().endsWith(ext)) {
                  results.push(fullPath);
                }
              }
            } catch (e) {}
            return results;
          }

          function stripComments(code) {
            if (!code) return '';
            return code.replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*$/gm, '$1').trim();
          }

          function parseRubricCriteria(rawRubric) {
            if (!rawRubric) {
              return [
                { name: 'HTML Structure & Layout', weight: 30, desc: 'HTML page structure, semantics, and markup' },
                { name: 'CSS Styling & Design', weight: 30, desc: 'CSS styling, visual hierarchy, and layout' },
                { name: 'JavaScript Interactivity & Logic', weight: 40, desc: 'Active JavaScript functions and core functionality' }
              ];
            }

            try {
              let parsed = typeof rawRubric === 'string' ? JSON.parse(rawRubric) : rawRubric;
              while (typeof parsed === 'string') parsed = JSON.parse(parsed);

              let list = Array.isArray(parsed) ? parsed : (parsed.criteria || parsed.items || []);
              if (Array.isArray(list) && list.length > 0) {
                return list.map((c, i) => ({
                  name: c.name || c.description || ('Criterion ' + (i + 1)),
                  weight: Number(c.weight ?? c.score ?? c.max ?? 20) || 20,
                  desc: c.description || c.name || ''
                }));
              }
            } catch (e) {}

            const lines = String(rawRubric).split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 3);
            const items = [];
            for (const line of lines) {
              const weightMatch = line.match(/\((\d+)\s*(?:pts?|points?|marks?|%)\)/i) ||
                                  line.match(/\[(\d+)\s*(?:pts?|points?|marks?|%)\]/i) ||
                                  line.match(/(\d+)\s*(?:pts?|points?|marks?)\s*[-:]/i);
              const weight = weightMatch ? parseInt(weightMatch[1], 10) : 20;
              const name = line.replace(/^\d+[\.\)]\s*/, '').replace(/^[-*•]\s*/, '').trim();
              if (name) items.push({ name: name, weight: weight, desc: name });
            }

            return items.length > 0 ? items : [
              { name: 'HTML Structure & Layout', weight: 30, desc: 'HTML page structure and markup' },
              { name: 'CSS Styling & Design', weight: 30, desc: 'CSS styling and visual design' },
              { name: 'JavaScript Interactivity & Logic', weight: 40, desc: 'Active JavaScript logic and functionality' }
            ];
          }

          async function evaluate() {
            const htmlFiles = findFiles(DIR, '.html');
            const cssFiles = findFiles(DIR, '.css');
            const jsFiles = findFiles(DIR, '.js');

            let allHtml = htmlFiles.map(f => fs.readFileSync(f, 'utf8')).join('\n\n');
            let allCss = cssFiles.map(f => fs.readFileSync(f, 'utf8')).join('\n\n');
            let allJs = jsFiles.map(f => fs.readFileSync(f, 'utf8')).join('\n\n');

            const activeJs = stripComments(allJs);
            const activeCss = stripComments(allCss);

            let jsSyntaxError = null;
            if (activeJs.length > 0) {
              try {
                new vm.Script(activeJs);
              } catch (err) {
                jsSyntaxError = err.message;
              }
            }

            const criteria = parseRubricCriteria(payload.rubricText);
            const totalMax = criteria.reduce((sum, c) => sum + c.weight, 0) || 100;

            if (!allHtml.trim() && !allCss.trim() && !allJs.trim()) {
              const breakdown = criteria.map(c => ({
                item: c.name,
                awarded: 0,
                max: c.weight,
                reason: 'Repository is empty or no project files were found.'
              }));
              fs.writeFileSync('result.json', JSON.stringify({
                score: 0,
                feedback: {
                  summary: 'Evaluation completed: No HTML, CSS, or JavaScript files were found in the repository.',
                  strengths: [],
                  issues: ['Repository contains no source code.'],
                  breakdown: breakdown
                }
              }));
              return;
            }

            const apiKey = process.env.OPENAI_API_KEY;
            let aiResult = null;

            if (apiKey) {
              try {
                const openai = new OpenAI({
                  apiKey: apiKey,
                  baseURL: process.env.OPENAI_BASE_URL || 'https://api.deepseek.com'
                });

                const systemPrompt = 'You are an expert, strict code evaluator. You grade student web submissions against the specified assignment rubric.\nCRITICAL RULES:\n1. Grade each rubric criterion individually and award marks between 0 and max weight.\n2. If code required for a criterion is commented out, missing, or purely placeholder, award 0 for that criterion.\n3. If there is a JavaScript syntax error preventing script execution, deduct points from JavaScript functionality criteria accordingly.\n4. Return a strict JSON object: {\"breakdown\": [{\"item\": \"Name\", \"awarded\": 20, \"max\": 20, \"reason\": \"Explanation\"}], \"strengths\": [], \"issues\": [], \"summary\": \"Summary\"}';

                const userPrompt = 'RUBRIC CRITERIA:\n' + JSON.stringify(criteria, null, 2) +
                  '\n\nSTUDENT FILES:\n- HTML: ' + htmlFiles.map(f => path.basename(f)).join(', ') +
                  '\n- CSS: ' + cssFiles.map(f => path.basename(f)).join(', ') +
                  '\n- JS: ' + jsFiles.map(f => path.basename(f)).join(', ') +
                  '\n- JS Syntax: ' + (jsSyntaxError ? ('SYNTAX ERROR: ' + jsSyntaxError) : 'Valid Syntax') +
                  '\n\nHTML CODE:\n' + allHtml.slice(0, 5000) +
                  '\n\nACTIVE CSS CODE:\n' + activeCss.slice(0, 3000) +
                  '\n\nACTIVE JS CODE (uncommented):\n' + activeJs.slice(0, 5000);

                const completion = await openai.chat.completions.create({
                  model: process.env.OPENAI_MODEL || 'deepseek-v4-flash',
                  temperature: 0,
                  response_format: { type: 'json_object' },
                  messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userPrompt }
                  ]
                });

                const content = completion.choices?.[0]?.message?.content || '{}';
                aiResult = JSON.parse(content);
              } catch (aiErr) {
                console.error('AI Evaluation error:', aiErr.message);
              }
            }

            if (!aiResult || !Array.isArray(aiResult.breakdown) || aiResult.breakdown.length === 0) {
              const breakdown = [];
              const strengths = [];
              const issues = [];
              let earnedTotal = 0;

              for (const c of criteria) {
                const desc = (c.desc || c.name || '').toLowerCase();
                let awarded = 0;
                let reason = '';

                if (desc.includes('html') || desc.includes('structure') || desc.includes('layout') || desc.includes('markup')) {
                  if (allHtml.length > 50 && allHtml.includes('<') && allHtml.includes('>')) {
                    awarded = c.weight;
                    reason = 'HTML structure present with standard markup tags.';
                  } else {
                    reason = 'HTML structure is missing or empty.';
                  }
                } else if (desc.includes('css') || desc.includes('style') || desc.includes('design') || desc.includes('responsive')) {
                  if (activeCss.length > 30) {
                    awarded = c.weight;
                    reason = 'Active CSS stylesheet styling implemented.';
                  } else {
                    reason = 'CSS styling is missing or empty.';
                  }
                } else if (desc.includes('js') || desc.includes('javascript') || desc.includes('logic') || desc.includes('function') || desc.includes('interactivity')) {
                  if (jsSyntaxError) {
                    awarded = 0;
                    reason = 'JavaScript syntax error: ' + jsSyntaxError;
                  } else if (activeJs.length > 40) {
                    awarded = c.weight;
                    reason = 'Active JavaScript logic implemented without syntax errors.';
                  } else {
                    awarded = 0;
                    reason = 'JavaScript file is empty or contains only commented-out code.';
                  }
                } else {
                  const words = desc.split(/\\s+/).filter(w => w.length > 3);
                  const matches = words.filter(w => allHtml.toLowerCase().includes(w) || activeJs.toLowerCase().includes(w));
                  if (matches.length > 0 && !jsSyntaxError) {
                    awarded = c.weight;
                    reason = 'Implemented required elements for ' + c.name + '.';
                  } else if (jsSyntaxError) {
                    awarded = 0;
                    reason = 'JavaScript syntax error prevented execution: ' + jsSyntaxError;
                  } else {
                    awarded = 0;
                    reason = 'Requirement ' + c.name + ' missing in active source code.';
                  }
                }

                earnedTotal += awarded;
                breakdown.push({ item: c.name, awarded: awarded, max: c.weight, reason: reason });
                if (awarded === c.weight) {
                  strengths.push('[' + c.name + '] ' + reason + ' (earned ' + awarded + '/' + c.weight + ' marks)');
                } else {
                  issues.push('[' + c.name + '] ' + reason + ' (earned ' + awarded + '/' + c.weight + ' marks)');
                }
              }

              const score = Math.round((earnedTotal / totalMax) * 100);
              aiResult = {
                score: score,
                breakdown: breakdown,
                strengths: strengths,
                issues: issues,
                summary: score >= 80 ? 'Great job! All core rubric criteria have been satisfied.' : ('Submission scored ' + score + '/100. Review the issues above for required fixes.')
              };
            }

            let earnedSum = 0;
            let maxSum = 0;
            const finalBreakdown = (aiResult.breakdown || []).map(b => {
              const maxPts = Number(b.max) || 20;
              const awardedPts = Math.min(Math.max(Number(b.awarded) || 0, 0), maxPts);
              earnedSum += awardedPts;
              maxSum += maxPts;
              return {
                item: b.item || 'Criterion',
                awarded: awardedPts,
                max: maxPts,
                reason: b.reason || ''
              };
            });

            const finalCalculatedScore = maxSum > 0 ? Math.round((earnedSum / maxSum) * 100) : (aiResult.score || 0);

            fs.writeFileSync('result.json', JSON.stringify({
              score: finalCalculatedScore,
              feedback: {
                summary: aiResult.summary || ('Evaluation completed with score ' + finalCalculatedScore + '/100.'),
                strengths: aiResult.strengths || [],
                issues: aiResult.issues || [],
                breakdown: finalBreakdown
              }
            }));
          }

          evaluate().catch(err => {
            console.error('Evaluation runtime failure:', err);
            fs.writeFileSync('result.json', JSON.stringify({
              score: 0,
              feedback: {
                summary: 'Evaluation encountered a fatal execution error.',
                strengths: [],
                issues: [err.message],
                breakdown: []
              }
            }));
          });
          "

      - name: Send Webhook Callback
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const https = require('https');
            const http = require('http');

            let resultObj = { score: 0, feedback: { summary: 'Evaluation completed.', strengths: [], issues: [], breakdown: [] } };
            try {
              if (fs.existsSync('result.json')) {
                resultObj = JSON.parse(fs.readFileSync('result.json', 'utf8'));
              }
            } catch (e) {}

            const payloadData = {
              jobId: '${{ github.event.client_payload.jobId }}',
              status: 'completed',
              result: {
                score: typeof resultObj.score === 'number' ? resultObj.score : 0,
                feedback: resultObj.feedback
              }
            };

            const data = JSON.stringify(payloadData);
            const webhookUrl = '${{ github.event.client_payload.webhookUrl }}';
            const secret = '${{ github.event.client_payload.webhookSecret }}';

            const u = new URL(webhookUrl);
            const reqLib = u.protocol === 'https:' ? https : http;

            const req = reqLib.request(webhookUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-webhook-secret': secret,
                'Content-Length': Buffer.byteLength(data)
              }
            }, (res) => {
              console.log('Webhook responded with status:', res.statusCode);
            });

            req.on('error', (e) => {
              console.error('Webhook request error:', e);
            });

            req.write(data);
            req.end();
          "
