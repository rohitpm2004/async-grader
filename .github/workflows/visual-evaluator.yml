name: Visual Evaluator

on:
  repository_dispatch:
    types: [run-visual-evaluation]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone Student Repository
        run: |
          REPO_URL="${{ github.event.client_payload.repoUrl }}"
          if [[ "$REPO_URL" == *"/blob/"* || "$REPO_URL" == *".html" ]]; then
            mkdir -p student-submission
            RAW_URL=$(echo "$REPO_URL" | sed 's|/blob/|/raw/|')
            curl -sL "$RAW_URL" -o student-submission/index.html
          else
            git clone "$REPO_URL" student-submission || {
              echo "Git clone failed"
              mkdir -p student-submission
            }
          fi

      - name: Run Syntax Check
        id: syntax
        run: |
          cat << 'EOF' > run-syntax.js
          const fs = require('fs');
          const path = require('path');
          const vm = require('vm');

          const DIR = path.join(process.cwd(), 'student-submission');

          function findFiles(dir, ext) {
            let results = [];
            if (!fs.existsSync(dir)) return results;
            try {
              const list = fs.readdirSync(dir, { withFileTypes: true });
              for (const item of list) {
                const fullPath = path.join(dir, item.name);
                if (item.isDirectory() && item.name !== 'node_modules' && item.name !== '.git') {
                  results = results.concat(findFiles(fullPath, ext));
                } else if (item.isFile() && item.name.toLowerCase().endsWith(ext)) {
                  results.push(fullPath);
                }
              }
            } catch (e) {}
            return results;
          }

          const jsFiles = findFiles(DIR, '.js');
          let errors = [];

          for (const f of jsFiles) {
            try {
              const code = fs.readFileSync(f, 'utf8');
              new vm.Script(code);
            } catch (e) {
              errors.push(`${path.basename(f)}: ${e.message}`);
            }
          }

          // Check inline <script> tags inside HTML files if no external JS exists
          const htmlFiles = findFiles(DIR, '.html');
          for (const h of htmlFiles) {
            try {
              const content = fs.readFileSync(h, 'utf8');
              const scriptMatches = content.match(/<script(?![^>]*src=)[^>]*>([\s\S]*?)<\/script>/gi) || [];
              for (let i = 0; i < scriptMatches.length; i++) {
                const code = scriptMatches[i].replace(/<\/?script[^>]*>/gi, '');
                if (code.trim()) {
                  try {
                    new vm.Script(code);
                  } catch (e) {
                    errors.push(`${path.basename(h)} (inline script ${i + 1}): ${e.message}`);
                  }
                }
              }
            } catch (e) {}
          }

          let reportContent = '';
          if (errors.length > 0) {
            reportContent = 'Syntax Error:\n' + errors.join('\n') + '\n';
          } else {
            reportContent = 'Syntax Check: Passed. No JavaScript compilation errors.\n';
          }

          fs.writeFileSync('report.txt', reportContent, 'utf8');
          console.log(reportContent);
          EOF
          node run-syntax.js

      - name: Send Webhook Callback
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const https = require("https");
            const http = require("http");

            let testOutput = "Syntax Check: Passed.";
            try {
              if (fs.existsSync("report.txt")) {
                testOutput = fs.readFileSync("report.txt", "utf8").trim();
              }
            } catch (e) {
              testOutput = "Syntax check report missing.";
            }

            const payloadData = {
              jobId: "${{ github.event.client_payload.jobId }}",
              status: "completed",
              testOutput: testOutput
            };

            const data = JSON.stringify(payloadData);
            const webhookUrl = "${{ github.event.client_payload.webhookUrl }}";
            const secret = "${{ github.event.client_payload.webhookSecret }}";

            const u = new URL(webhookUrl);
            const reqLib = u.protocol === "https:" ? https : http;

            const req = reqLib.request(webhookUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-webhook-secret": secret,
                "Content-Length": Buffer.byteLength(data),
                "Connection": "close"
              }
            }, (res) => {
              console.log("Webhook responded with status:", res.statusCode);
              res.resume();
              res.on("end", () => process.exit(0));
            });

            req.on("error", (e) => {
              console.error("Webhook request error:", e);
              process.exit(0);
            });

            req.write(data);
            req.end();
          '
