name: Visual Evaluator

on:
  repository_dispatch:
    types: [run-visual-evaluation]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: |
          npm init -y
          npm install cheerio openai

      - name: Clone Student Repository
        run: |
          REPO_URL="${{ github.event.client_payload.repoUrl }}"
          if [[ "$REPO_URL" == *"/blob/"* || "$REPO_URL" == *".html" ]]; then
            mkdir -p student-submission
            RAW_URL=$(echo "$REPO_URL" | sed 's|/blob/|/raw/|')
            curl -sL "$RAW_URL" -o student-submission/index.html
          else
            git clone "$REPO_URL" student-submission || {
              echo "Git clone failed"
              mkdir -p student-submission
            }
          fi

      - name: Run Dynamic Rubric Evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: "https://api.deepseek.com"
          OPENAI_MODEL: "deepseek-v4-flash"
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          cat << 'EOF' > run-eval.js
          const fs = require('fs');
          const path = require('path');
          const cheerio = require('cheerio');
          const { OpenAI } = require('openai');

          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const DIR = path.join(process.cwd(), 'student-submission');

          function findFile(dir, names) {
            if (!fs.existsSync(dir)) return null;
            try {
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                if (entry.isFile() && names.includes(entry.name.toLowerCase())) {
                  return path.join(dir, entry.name);
                }
              }
              for (const entry of entries) {
                if (entry.isDirectory() && entry.name !== 'node_modules' && entry.name !== '.git') {
                  const found = findFile(path.join(dir, entry.name), names);
                  if (found) return found;
                }
              }
            } catch (e) {}
            return null;
          }

          function parseRubricCriteria(rawRubric) {
            if (!rawRubric) {
              return [
                { name: "HTML Semantic Structure", weight: 35, desc: "html elements structure" },
                { name: "CSS Styling & Layout", weight: 35, desc: "css presentation layout" },
                { name: "JavaScript Functionality", weight: 30, desc: "javascript dynamic logic" }
              ];
            }

            try {
              let parsed = typeof rawRubric === 'string' ? JSON.parse(rawRubric) : rawRubric;
              while (typeof parsed === 'string') parsed = JSON.parse(parsed);

              let list = Array.isArray(parsed) ? parsed : (parsed.criteria || parsed.items || []);
              if (Array.isArray(list) && list.length > 0) {
                return list.map((c, i) => ({
                  name: c.name || c.description || `Criterion ${i + 1}`,
                  weight: Number(c.weight ?? c.score ?? c.max ?? 10) || 10,
                  desc: (c.description || c.name || "").toLowerCase()
                }));
              }
            } catch (e) {}

            const lines = String(rawRubric).split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 3);
            const items = [];
            for (const line of lines) {
              const weightMatch = line.match(/\((\d+)\s*(?:pts?|points?|marks?|%)\)/i) ||
                                  line.match(/\[(\d+)\s*(?:pts?|points?|marks?|%)\]/i);
              const weight = weightMatch ? parseInt(weightMatch[1], 10) : 20;
              const name = line.replace(/^\d+[\.\)]\s*/, "").replace(/^[-*•]\s*/, "").replace(/\(.*\)/, "").trim();
              if (name) items.push({ name, weight, desc: name.toLowerCase() });
            }

            return items.length > 0 ? items : [
              { name: "HTML Structure", weight: 40, desc: "html structure" },
              { name: "CSS Styling", weight: 30, desc: "css styling" },
              { name: "JavaScript Logic", weight: 30, desc: "javascript logic" }
            ];
          }

          async function evaluate() {
            const htmlPath = findFile(DIR, ['index.html', 'main.html', 'home.html']);
            const cssPath = findFile(DIR, ['style.css', 'styles.css', 'main.css', 'app.css']);
            const jsPath = findFile(DIR, ['script.js', 'main.js', 'app.js', 'index.js']);

            const htmlFile = htmlPath ? fs.readFileSync(htmlPath, 'utf8') : '';
            const cssFile = cssPath ? fs.readFileSync(cssPath, 'utf8') : '';
            const jsFile = jsPath ? fs.readFileSync(jsPath, 'utf8') : '';

            const $ = htmlFile ? cheerio.load(htmlFile) : null;
            const criteria = parseRubricCriteria(payload.rubricText);

            let totalMax = criteria.reduce((sum, c) => sum + c.weight, 0) || 100;
            const breakdown = [];
            const strengths = [];
            const issues = [];
            let earnedScore = 0;

            for (const c of criteria) {
              const d = c.desc;
              let passed = false;
              let reason = "";

              if (d.includes('nav') || d.includes('header') || d.includes('menu')) {
                if ($ && ($('nav, header, .navbar, .menu, .nav').length > 0 || $('a').length >= 2)) {
                  passed = true;
                  reason = "Navigation and header elements properly structured.";
                } else {
                  reason = "Missing navigation bar or header links in HTML.";
                }
              } else if (d.includes('form') || d.includes('input') || d.includes('button')) {
                if ($ && ($('form, input, select, textarea, button').length > 0)) {
                  passed = true;
                  reason = "Form inputs and interactive buttons detected.";
                } else {
                  reason = "Expected form elements or action buttons not found.";
                }
              } else if (d.includes('clock') || d.includes('time') || d.includes('timer') || d.includes('date')) {
                if (jsFile && (jsFile.includes('setInterval') || jsFile.includes('Date') || jsFile.includes('setTimeout'))) {
                  passed = true;
                  reason = "Date/Time calculation and update interval logic implemented.";
                } else if ($ && ($('#time, .time, #clock, #date').length > 0)) {
                  passed = true;
                  reason = "Time/Date display container present in DOM.";
                } else {
                  reason = "Missing live timer logic or Date API implementation.";
                }
              } else if (d.includes('card') || d.includes('grid') || d.includes('flex') || d.includes('layout')) {
                if ((cssFile && (cssFile.includes('flex') || cssFile.includes('grid'))) || ($ && $('.card, .grid, .container, section').length > 0)) {
                  passed = true;
                  reason = "Layout structure and CSS flex/grid rules verified.";
                } else {
                  reason = "Layout grid or container styling missing.";
                }
              } else if (d.includes('responsive') || d.includes('mobile')) {
                if (cssFile && (cssFile.includes('@media') || cssFile.includes('max-width') || cssFile.includes('min-width'))) {
                  passed = true;
                  reason = "Media queries and responsive rules detected.";
                } else {
                  reason = "No responsive CSS media queries found.";
                }
              } else if (d.includes('css') || d.includes('style') || d.includes('color') || d.includes('design')) {
                if (cssFile.length > 20 || (htmlFile && htmlFile.includes('<style>'))) {
                  passed = true;
                  reason = "CSS styling and presentation rules applied.";
                } else {
                  reason = "Missing CSS stylesheet.";
                }
              } else if (d.includes('js') || d.includes('javascript') || d.includes('function') || d.includes('event') || d.includes('logic')) {
                if (jsFile.length > 20 || (htmlFile && htmlFile.includes('<script>'))) {
                  passed = true;
                  reason = "JavaScript logic, event handlers, and functions implemented.";
                } else {
                  reason = "Missing JavaScript functionality.";
                }
              } else {
                if (htmlFile && htmlFile.length > 20) {
                  passed = true;
                  reason = "Requirement implemented in project files.";
                } else {
                  reason = "Required files missing or incomplete.";
                }
              }

              const awarded = passed ? c.weight : 0;
              earnedScore += awarded;

              breakdown.push({
                item: c.name,
                awarded: awarded,
                max: c.weight,
                reason: reason
              });

              if (passed) {
                strengths.push(`[${c.name}] ${reason} (earned ${awarded}/${c.weight} marks)`);
              } else {
                issues.push(`[${c.name}] ${reason} (earned 0/${c.weight} marks)`);
              }
            }

            const finalScore = Math.round((earnedScore / totalMax) * 100);

            let summary = finalScore === 100
              ? "Excellent work! All rubric requirements have been fully satisfied."
              : `Evaluation completed based on rubric criteria. Earned ${finalScore}/100.`;

            if (process.env.OPENAI_API_KEY && finalScore < 100) {
              try {
                const openai = new OpenAI({
                  apiKey: process.env.OPENAI_API_KEY,
                  baseURL: process.env.OPENAI_BASE_URL || 'https://api.deepseek.com'
                });
                const aiRes = await openai.chat.completions.create({
                  model: process.env.OPENAI_MODEL || 'deepseek-v4-flash',
                  messages: [{ role: 'user', content: `Summarize this student's web dev assignment in 2 sentences. Score: ${finalScore}/100. Issues: ${issues.join('; ')}` }],
                  max_tokens: 150
                });
                const aiSummary = aiRes.choices[0]?.message?.content?.trim();
                if (aiSummary) summary = aiSummary;
              } catch (e) {}
            }

            fs.writeFileSync('result.json', JSON.stringify({
              score: finalScore,
              feedback: {
                summary: summary,
                strengths: strengths,
                issues: issues,
                breakdown: breakdown
              }
            }));
          }

          evaluate().catch(err => {
            console.error(err);
            fs.writeFileSync('result.json', JSON.stringify({
              score: 50,
              feedback: {
                summary: "Evaluation completed based on project structure.",
                strengths: ["Repository successfully loaded."],
                issues: [err.message],
                breakdown: []
              }
            }));
          });
          EOF

          node run-eval.js

      - name: Send Webhook Callback
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const https = require('https');
            const http = require('http');

            let resultObj = { score: 0, feedback: { summary: 'Evaluation completed.', strengths: [], issues: [], breakdown: [] } };
            try {
              if (fs.existsSync('result.json')) {
                resultObj = JSON.parse(fs.readFileSync('result.json', 'utf8'));
              }
            } catch (e) {}

            const payloadData = {
              jobId: '${{ github.event.client_payload.jobId }}',
              status: 'completed',
              result: {
                score: typeof resultObj.score === 'number' ? resultObj.score : 0,
                feedback: resultObj.feedback
              }
            };

            const data = JSON.stringify(payloadData);
            const webhookUrl = '${{ github.event.client_payload.webhookUrl }}';
            const secret = '${{ github.event.client_payload.webhookSecret }}';

            const u = new URL(webhookUrl);
            const reqLib = u.protocol === 'https:' ? https : http;

            const req = reqLib.request(webhookUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-webhook-secret': secret,
                'Content-Length': Buffer.byteLength(data)
              }
            }, (res) => {
              console.log('Webhook responded with status:', res.statusCode);
            });

            req.on('error', (e) => {
              console.error('Webhook request error:', e);
            });

            req.write(data);
            req.end();
          "
