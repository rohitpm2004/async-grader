name: Evaluate Fullstack Assignment

on:
  repository_dispatch:
    types: [run-fullstack-evaluation]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Student Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repoUrl }}
          path: student-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        working-directory: ./student-repo
        run: |
          # Try installing in root, backend, and frontend folders
          if [ -f package.json ]; then npm install --legacy-peer-deps; fi
          if [ -d backend ] && [ -f backend/package.json ]; then cd backend && npm install --legacy-peer-deps && cd ..; fi
          if [ -d frontend ] && [ -f frontend/package.json ]; then cd frontend && npm install --legacy-peer-deps && cd ..; fi
          if [ -d client ] && [ -f client/package.json ]; then cd client && npm install --legacy-peer-deps && cd ..; fi
          if [ -d server ] && [ -f server/package.json ]; then cd server && npm install --legacy-peer-deps && cd ..; fi

      - name: Smart Build (Fallback Logic)
        id: build
        working-directory: ./student-repo
        continue-on-error: true
        run: |
          # Try building frontend if it exists
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            cd frontend
            if jq -e '.scripts.build' package.json > /dev/null; then npm run build; fi
            cd ..
          elif [ -d client ] && [ -f client/package.json ]; then
            cd client
            if jq -e '.scripts.build' package.json > /dev/null; then npm run build; fi
            cd ..
          elif jq -e '.scripts.build' package.json > /dev/null; then
            npm run build
          else
            echo "No build script found. Skipping."
          fi

      - name: Run Linter (Syntax Check)
        id: lint
        working-directory: ./student-repo
        continue-on-error: true
        run: |
          echo "Running ESLint across the project..."
          npx eslint . --ext .js,.jsx,.ts,.tsx > linter-report.txt || true
          cat linter-report.txt

      - name: Send Webhook Result
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" == "failure" ]; then
            STATUS="failed"
            OUTPUT="Build: Failed. The application could not be compiled. Check for syntax errors."
          else
            STATUS="completed"
            LINT_OUTPUT=$(cat ./student-repo/linter-report.txt 2>/dev/null || echo "No lint errors.")
            OUTPUT="Fullstack Build: Success.\nLinter Report:\n$LINT_OUTPUT"
          fi
          
          # Send back to Node server
          curl -X POST -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg status "$STATUS" \
              --arg output "$OUTPUT" \
              --arg secret "${{ github.event.client_payload.webhookSecret }}" \
              '{status: $status, testOutput: $output, webhookSecret: $secret}')" \
            "${{ github.event.client_payload.webhookUrl }}"
